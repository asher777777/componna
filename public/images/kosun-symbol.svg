<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glow -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="11" y="11" width="98" height="98" rx="27" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Modern Geometric K / ק Element -->
  <!-- Vertical Pillar -->
  <rect x="34" y="30" width="13" height="60" rx="6.5" fill="url(#sparkleGrad)" />

  <!-- Upper Diagonal Wing -->
  <path d="M47 56 L69 34 C71.5 31.5 76 33.2 76 36.8 L76 43 C76 44.8 75.2 46.5 73.8 47.7 L57 63 Z" fill="url(#sparkleGrad)" opacity="0.95" />

  <!-- Lower Dynamic Wing with Cyan Glow Accent -->
  <path d="M52 57 L77 82 C78.5 83.5 77.8 86 75.7 86 L67 86 C65 86 63.2 85.1 61.9 83.7 L45 66 Z" fill="url(#accentGrad)" />

  <!-- 2026 AI Core Sparkle (Top-Right) -->
  <path d="M85 24 Q85 32 93 32 Q85 32 85 40 Q85 32 77 32 Q85 32 85 24 Z" fill="#ffffff" opacity="0.9" />
</svg>
