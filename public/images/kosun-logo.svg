<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="logoAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="logoWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 8)">
    <!-- Base Rounded Square -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#logoBgGrad)" filter="url(#logoGlow)" />
    <rect x="0.5" y="0.5" width="63" height="63" rx="17.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

    <!-- K Geometric Elements -->
    <rect x="16" y="14" width="8" height="36" rx="4" fill="url(#logoWhiteGrad)" />
    <path d="M24 30 L38 16 C39.5 14.5 42.5 15.6 42.5 17.8 L42.5 22 C42.5 23.2 41.9 24.3 41 25.1 L30 35 Z" fill="url(#logoWhiteGrad)" opacity="0.95" />
    <path d="M27 31 L43 47 C44 48 43.5 50 42 50 L37 50 C35.7 50 34.5 49.4 33.7 48.5 L22 36 Z" fill="url(#logoAccentGrad)" />

    <!-- Mini Sparkle -->
    <path d="M49 8 Q49 13 54 13 Q49 13 49 18 Q49 13 44 13 Q49 13 49 8 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <!-- Hebrew Primary Wordmark -->
  <text x="82" y="42" font-family="'Heebo', 'Assistant', sans-serif" font-weight="900" font-size="28" fill="#1e1b4b" letter-spacing="-0.5">
    קושאן
  </text>

  <!-- English Badge & Tagline -->
  <g transform="translate(82, 49)">
    <rect x="0" y="2" width="62" height="17" rx="5" fill="#e0e7ff" opacity="0.8" />
    <text x="7" y="14" font-family="'Heebo', sans-serif" font-weight="800" font-size="10" fill="#4338ca" letter-spacing="0.5">
      KOSUN
    </text>
    <text x="70" y="14" font-family="'Heebo', sans-serif" font-weight="500" font-size="11" fill="#64748b">
      כל אדם זה נכס
    </text>
  </g>
</svg>
